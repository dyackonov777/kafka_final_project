# Аналитическая платформа маркетплейса «Покупай выгодно».
#
#   Основной кластер Kafka (primary):     kafka-1..3,  KRaft, mTLS + ACL, RF=3, min.insync.replicas=2
#   Аналитический кластер (analytics):    kafka-b1..3, KRaft, mTLS + ACL, RF=3, min.insync.replicas=2
#   Дублирование primary -> analytics:    mirror-maker (MirrorMaker 2)
#   Потоковая обработка:                  faust-moderation (Faust): фильтр запрещённых товаров, учёт резервов
#   Хранение и поиск:                     Kafka Connect -> Elasticsearch (с аутентификацией) + файл
#   Data Lake и аналитика:                HDFS + Spark (master, worker, постоянная загрузка spark-ingest)
#   Мониторинг:                           JMX Exporter, kafka-exporter, Faust /metrics -> Prometheus
#                                         -> Grafana, Alertmanager (webhook / Telegram)
#
# Все порты публикуются только на 127.0.0.1 (переменная BIND_ADDRESS в .env).
# Запуск всего стенда: bash start.sh (см. README.md)

name: marketplace-analytics

# ---------------------------------------------------------------------------
# Общие настройки брокеров обоих кластеров: TLS, ACL, надёжность
# ---------------------------------------------------------------------------
x-kafka-common-env: &kafka-common-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  # Все listener'ы работают по TLS, в том числе трафик контроллеров KRaft
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SSL,INTERNAL_SSL:SSL,EXTERNAL_SSL:SSL
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL_SSL
  KAFKA_LOG_DIRS: /var/lib/kafka/data

  # --- TLS: файлы лежат в /etc/kafka/secrets (certs/<broker>) ---
  KAFKA_SSL_KEYSTORE_TYPE: PKCS12
  KAFKA_SSL_KEYSTORE_FILENAME: broker.keystore.p12
  KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
  KAFKA_SSL_KEY_CREDENTIALS: sslkey_creds
  KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
  KAFKA_SSL_TRUSTSTORE_FILENAME: broker.truststore.p12
  KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore_creds
  # Взаимная аутентификация: без сертификата нашего CA подключиться нельзя
  KAFKA_SSL_CLIENT_AUTH: required
  KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https

  # --- ACL (KRaft): всё, что не разрешено явно, запрещено ---
  KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
  KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"

  # --- Репликация и надёжность ---
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
  # JMX Exporter: метрики брокера на :7071/metrics
  KAFKA_OPTS: -javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent.jar=7071:/opt/jmx-exporter/kafka-broker.yml

x-primary-env: &primary-env
  <<: *kafka-common-env
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
  # Principal при mTLS = Subject сертификата (CN=<имя>)
  KAFKA_SUPER_USERS: User:CN=kafka-1;User:CN=kafka-2;User:CN=kafka-3;User:CN=admin

x-analytics-env: &analytics-env
  <<: *kafka-common-env
  CLUSTER_ID: bW9ja2FuYWx5dGljczAwMQ
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-b1:29093,2@kafka-b2:29093,3@kafka-b3:29093
  # MirrorMaker 2 — владелец аналитического кластера: создаёт топики-копии и служебные топики
  KAFKA_SUPER_USERS: User:CN=kafka-b1;User:CN=kafka-b2;User:CN=kafka-b3;User:CN=admin;User:CN=mirror-maker

# Образ marketplace/kafka-jmx собирается один раз (build указан только у kafka-1),
# остальные брокеры используют готовый образ. start.sh выполняет docker compose build заранее.
x-broker: &broker
  image: marketplace/kafka-jmx:7.6.1
  restart: unless-stopped
  mem_limit: 1g
  healthcheck:
    # KAFKA_OPTS обнуляем, иначе CLI попытается занять порт 7071 вторым JMX-агентом
    test: ["CMD-SHELL", "KAFKA_OPTS= KAFKA_HEAP_OPTS=-Xmx128m kafka-broker-api-versions --bootstrap-server $$(hostname):19092 --command-config /etc/kafka/clients/admin.properties >/dev/null 2>&1"]
    interval: 15s
    timeout: 30s
    retries: 20
    start_period: 30s

x-client-truststore: &client-truststore ./certs/clients/client.truststore.p12:/etc/kafka/clients/client.truststore.p12:ro
x-admin-cert: &admin-cert ./certs/clients/admin:/etc/kafka/clients/admin:ro
x-admin-props: &admin-props ./certs/clients/admin.properties:/etc/kafka/clients/admin.properties:ro
x-jmx-config: &jmx-config ./monitoring/jmx-exporter/kafka-broker.yml:/opt/jmx-exporter/kafka-broker.yml:ro

x-primary-healthy: &primary-healthy
  kafka-1: { condition: service_healthy }
  kafka-2: { condition: service_healthy }
  kafka-3: { condition: service_healthy }

# Образ Python-сервисов собирает faust-moderation, CLI-контейнеры используют его же
x-cli: &cli
  image: marketplace/app:1.0
  entrypoint: ["sleep", "infinity"]
  mem_limit: 192m
  depends_on:
    faust-moderation: { condition: service_healthy }

services:

  # =========================================================================
  # Основной кластер Kafka (primary): 3 брокера KRaft, TLS + ACL
  # =========================================================================
  kafka-1:
    <<: *broker
    build:
      context: .
      dockerfile: docker/kafka/Dockerfile
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9093:9092"
    environment:
      <<: *primary-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL_SSL://kafka-1:19092,EXTERNAL_SSL://0.0.0.0:9092,CONTROLLER://kafka-1:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL_SSL://kafka-1:19092,EXTERNAL_SSL://localhost:9093
    volumes:
      - kafka-1-data:/var/lib/kafka/data
      - ./certs/kafka-1:/etc/kafka/secrets:ro
      - *admin-cert
      - *admin-props
      - *client-truststore
      - *jmx-config

  kafka-2:
    <<: *broker
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9094:9092"
    environment:
      <<: *primary-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL_SSL://kafka-2:19092,EXTERNAL_SSL://0.0.0.0:9092,CONTROLLER://kafka-2:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL_SSL://kafka-2:19092,EXTERNAL_SSL://localhost:9094
    volumes:
      - kafka-2-data:/var/lib/kafka/data
      - ./certs/kafka-2:/etc/kafka/secrets:ro
      - *admin-cert
      - *admin-props
      - *client-truststore
      - *jmx-config

  kafka-3:
    <<: *broker
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9095:9092"
    environment:
      <<: *primary-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL_SSL://kafka-3:19092,EXTERNAL_SSL://0.0.0.0:9092,CONTROLLER://kafka-3:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL_SSL://kafka-3:19092,EXTERNAL_SSL://localhost:9095
    volumes:
      - kafka-3-data:/var/lib/kafka/data
      - ./certs/kafka-3:/etc/kafka/secrets:ro
      - *admin-cert
      - *admin-props
      - *client-truststore
      - *jmx-config

  # =========================================================================
  # Аналитический кластер (analytics): 3 брокера KRaft, TLS + ACL.
  # Копия данных для Data Lake, заполняется MirrorMaker 2.
  # =========================================================================
  kafka-b1:
    <<: *broker
    container_name: kafka-b1
    hostname: kafka-b1
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9096:9092"
    environment:
      <<: *analytics-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL_SSL://kafka-b1:19092,EXTERNAL_SSL://0.0.0.0:9092,CONTROLLER://kafka-b1:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL_SSL://kafka-b1:19092,EXTERNAL_SSL://localhost:9096
    volumes:
      - kafka-b1-data:/var/lib/kafka/data
      - ./certs/kafka-b1:/etc/kafka/secrets:ro
      - *admin-cert
      - *admin-props
      - *client-truststore
      - *jmx-config

  kafka-b2:
    <<: *broker
    container_name: kafka-b2
    hostname: kafka-b2
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9097:9092"
    environment:
      <<: *analytics-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL_SSL://kafka-b2:19092,EXTERNAL_SSL://0.0.0.0:9092,CONTROLLER://kafka-b2:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL_SSL://kafka-b2:19092,EXTERNAL_SSL://localhost:9097
    volumes:
      - kafka-b2-data:/var/lib/kafka/data
      - ./certs/kafka-b2:/etc/kafka/secrets:ro
      - *admin-cert
      - *admin-props
      - *client-truststore
      - *jmx-config

  kafka-b3:
    <<: *broker
    container_name: kafka-b3
    hostname: kafka-b3
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9098:9092"
    environment:
      <<: *analytics-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL_SSL://kafka-b3:19092,EXTERNAL_SSL://0.0.0.0:9092,CONTROLLER://kafka-b3:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL_SSL://kafka-b3:19092,EXTERNAL_SSL://localhost:9098
    volumes:
      - kafka-b3-data:/var/lib/kafka/data
      - ./certs/kafka-b3:/etc/kafka/secrets:ro
      - *admin-cert
      - *admin-props
      - *client-truststore
      - *jmx-config

  # Контейнер с Kafka CLI для администрирования обоих кластеров: топики, ACL, проверки.
  # Брокеры запущены с JMX-агентом в KAFKA_OPTS, поэтому CLI удобнее запускать отдельно.
  kafka-tools:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-tools
    hostname: kafka-tools
    entrypoint: ["sleep", "infinity"]
    mem_limit: 768m
    environment:
      KAFKA_HEAP_OPTS: -Xmx256m
      PRIMARY_BOOTSTRAP: kafka-1:19092,kafka-2:19092,kafka-3:19092
      ANALYTICS_BOOTSTRAP: kafka-b1:19092,kafka-b2:19092,kafka-b3:19092
    volumes:
      - ./certs/clients:/etc/kafka/clients:ro
      - ./scripts/kafka:/scripts:ro

  # MirrorMaker 2: дублирование топиков primary -> analytics (имена получают префикс "primary.")
  mirror-maker:
    image: confluentinc/cp-kafka:7.6.1
    container_name: mirror-maker
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      <<: *primary-healthy
      kafka-b1: { condition: service_healthy }
      kafka-b2: { condition: service_healthy }
      kafka-b3: { condition: service_healthy }
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:?задайте KEYSTORE_PASSWORD в .env}
      # Правильный путь к log4j в образе cp-kafka
      KAFKA_LOG4J_OPTS: -Dlog4j.configuration=file:/etc/kafka/connect-log4j.properties
    entrypoint: [ "bash", "-c" ]
    command:
      - |
        sed "s|__KEYSTORE_PASSWORD__|$${KEYSTORE_PASSWORD}|g" /etc/mm2/mm2.properties.tmpl > /tmp/mm2.properties
        exec connect-mirror-maker /tmp/mm2.properties
    volumes:
      - ./config/mirror-maker/mm2.properties.tmpl:/etc/mm2/mm2.properties.tmpl:ro
      - ./certs/clients/mirror-maker:/etc/kafka/clients/mirror-maker:ro
      - ./certs/clients/mirror-maker.properties:/etc/kafka/clients/mirror-maker.properties:ro
      - *client-truststore
    healthcheck:
      test: [ "CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m kafka-topics --bootstrap-server kafka-b1:19092 --command-config /etc/kafka/clients/mirror-maker.properties --list 2>/dev/null | grep -q '^primary.products-filtered$$'" ]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 40s

  # =========================================================================
  # Потоковая обработка (Faust): фильтр запрещённых товаров и учёт резервов по заказам
  # =========================================================================
  faust-moderation:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: marketplace/app:1.0
    container_name: faust-moderation
    hostname: faust-moderation
    restart: unless-stopped
    mem_limit: 512m
    depends_on: *primary-healthy
    environment:
      KAFKA_BOOTSTRAP: kafka-1:19092,kafka-2:19092,kafka-3:19092
      CERTS_DIR: /certs
    command: ["python", "-m", "marketplace.moderation", "worker", "-l", "info"]
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/clients/moderation:/certs/moderation:ro
    healthcheck:
      # Веб-сервер Faust поднимается после старта приложения; /metrics читает Prometheus
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6066/metrics', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  # CLI-контейнеры: у каждого только свой сертификат (принцип минимальных прав).
  shop-api-cli:
    <<: *cli
    container_name: shop-api-cli
    environment:
      KAFKA_BOOTSTRAP: kafka-1:19092,kafka-2:19092,kafka-3:19092
      CERTS_DIR: /certs
    volumes:
      - ./data:/app/data:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/clients/shop-api:/certs/shop-api:ro

  client-api-cli:
    <<: *cli
    container_name: client-api-cli
    environment:
      KAFKA_BOOTSTRAP: kafka-1:19092,kafka-2:19092,kafka-3:19092
      CERTS_DIR: /certs
      ES_URL: http://elasticsearch:9200
      ES_USER: client_api
      ES_PASSWORD: ${ES_CLIENT_PASSWORD:?задайте ES_CLIENT_PASSWORD в .env}
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/clients/client-api:/certs/client-api:ro

  moderator-cli:
    <<: *cli
    container_name: moderator-cli
    environment:
      KAFKA_BOOTSTRAP: kafka-1:19092,kafka-2:19092,kafka-3:19092
      CERTS_DIR: /certs
    volumes:
      - ./data:/app/data:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/clients/moderator:/certs/moderator:ro

  # =========================================================================
  # Хранение и поиск: Kafka Connect -> Elasticsearch / файл
  # =========================================================================
  elasticsearch:
    image: elasticsearch:7.17.25
    container_name: elasticsearch
    restart: unless-stopped
    mem_limit: 1536m
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9200:9200"
    environment:
      discovery.type: single-node
      # Аутентификация включена: пользователи и роли создаёт scripts/init-elasticsearch.sh
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?задайте ELASTIC_PASSWORD в .env}
      ES_JAVA_OPTS: -Xms768m -Xmx768m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  kafka-connect:
    build:
      context: .
      dockerfile: docker/connect/Dockerfile
    image: marketplace/kafka-connect:7.6.1
    container_name: kafka-connect
    hostname: kafka-connect
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      <<: *primary-healthy
      elasticsearch: { condition: service_healthy }
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/usr/share/filestream-connectors
      # Секреты в конфиге коннектора задаются ссылкой ${env:ИМЯ} и не видны в REST API и в Git
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      ES_CONNECT_PASSWORD: ${ES_CONNECT_PASSWORD:?задайте ES_CONNECT_PASSWORD в .env}
      KAFKA_HEAP_OPTS: -Xms512m -Xmx768m
      # JMX Exporter: статусы коннекторов и задач на :9404/metrics
      KAFKA_OPTS: -javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent.jar=9404:/opt/jmx-exporter/kafka-connect.yml
      # TLS: воркер, а также его producer / consumer / admin клиенты (CN=connect)
      CONNECT_SECURITY_PROTOCOL: SSL
      CONNECT_SSL_TRUSTSTORE_TYPE: PKCS12
      CONNECT_SSL_TRUSTSTORE_LOCATION: /etc/kafka/clients/client.truststore.p12
      CONNECT_SSL_TRUSTSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
      CONNECT_SSL_KEYSTORE_TYPE: PKCS12
      CONNECT_SSL_KEYSTORE_LOCATION: /etc/kafka/clients/connect/connect.keystore.p12
      CONNECT_SSL_KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
      CONNECT_SSL_KEY_PASSWORD: ${KEYSTORE_PASSWORD}
      CONNECT_PRODUCER_SECURITY_PROTOCOL: SSL
      CONNECT_PRODUCER_SSL_TRUSTSTORE_TYPE: PKCS12
      CONNECT_PRODUCER_SSL_TRUSTSTORE_LOCATION: /etc/kafka/clients/client.truststore.p12
      CONNECT_PRODUCER_SSL_TRUSTSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
      CONNECT_PRODUCER_SSL_KEYSTORE_TYPE: PKCS12
      CONNECT_PRODUCER_SSL_KEYSTORE_LOCATION: /etc/kafka/clients/connect/connect.keystore.p12
      CONNECT_PRODUCER_SSL_KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
      CONNECT_PRODUCER_SSL_KEY_PASSWORD: ${KEYSTORE_PASSWORD}
      CONNECT_CONSUMER_SECURITY_PROTOCOL: SSL
      CONNECT_CONSUMER_SSL_TRUSTSTORE_TYPE: PKCS12
      CONNECT_CONSUMER_SSL_TRUSTSTORE_LOCATION: /etc/kafka/clients/client.truststore.p12
      CONNECT_CONSUMER_SSL_TRUSTSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
      CONNECT_CONSUMER_SSL_KEYSTORE_TYPE: PKCS12
      CONNECT_CONSUMER_SSL_KEYSTORE_LOCATION: /etc/kafka/clients/connect/connect.keystore.p12
      CONNECT_CONSUMER_SSL_KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
      CONNECT_CONSUMER_SSL_KEY_PASSWORD: ${KEYSTORE_PASSWORD}
      CONNECT_ADMIN_SECURITY_PROTOCOL: SSL
      CONNECT_ADMIN_SSL_TRUSTSTORE_TYPE: PKCS12
      CONNECT_ADMIN_SSL_TRUSTSTORE_LOCATION: /etc/kafka/clients/client.truststore.p12
      CONNECT_ADMIN_SSL_TRUSTSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
      CONNECT_ADMIN_SSL_KEYSTORE_TYPE: PKCS12
      CONNECT_ADMIN_SSL_KEYSTORE_LOCATION: /etc/kafka/clients/connect/connect.keystore.p12
      CONNECT_ADMIN_SSL_KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
      CONNECT_ADMIN_SSL_KEY_PASSWORD: ${KEYSTORE_PASSWORD}
    volumes:
      - ./certs/clients/connect:/etc/kafka/clients/connect:ro
      - *client-truststore
      - ./monitoring/jmx-exporter/kafka-connect.yml:/opt/jmx-exporter/kafka-connect.yml:ro
      - connect-sink:/data/sink
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  # =========================================================================
  # Data Lake (HDFS) и аналитика (Spark)
  # =========================================================================
  namenode:
    image: apache/hadoop:3.3.6
    container_name: namenode
    hostname: namenode
    restart: unless-stopped
    mem_limit: 1g
    command: ["hdfs", "namenode"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9870:9870"
    env_file:
      - ./config/hadoop/hadoop.env
    environment:
      # Отформатировать namenode при первом запуске (каталог из dfs.namenode.name.dir)
      ENSURE_NAMENODE_DIR: /tmp/hadoop/dfs/name
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -safemode get | grep -q OFF"]
      interval: 15s
      timeout: 20s
      retries: 30
      start_period: 20s

  datanode:
    image: apache/hadoop:3.3.6
    container_name: datanode
    hostname: datanode
    restart: unless-stopped
    mem_limit: 1g
    command: ["hdfs", "datanode"]
    env_file:
      - ./config/hadoop/hadoop.env
    depends_on:
      namenode: { condition: service_healthy }
    healthcheck:
      # Готов, когда namenode видит живой datanode
      test: ["CMD-SHELL", "hdfs dfsadmin -report 2>/dev/null | grep -q 'Live datanodes (1)'"]
      interval: 15s
      timeout: 20s
      retries: 30
      start_period: 20s

  spark-master:
    image: apache/spark:3.5.6-scala2.12-java17-python3-ubuntu
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped
    mem_limit: 2g
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8090:8080"   # Spark Master UI
      - "${BIND_ADDRESS:-127.0.0.1}:4040:4040"   # UI пакетного приложения (recommendations.py)
    environment:
      ANALYTICS_BOOTSTRAP: kafka-b1:19092,kafka-b2:19092,kafka-b3:19092
      PRIMARY_BOOTSTRAP: kafka-1:19092,kafka-2:19092,kafka-3:19092
      HDFS_URL: hdfs://namenode:8020
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
    volumes:
      - ./analytics:/opt/analytics:ro
      - ./certs/clients/analytics:/opt/certs/analytics:ro
      - ./certs/clients/client.truststore.p12:/opt/certs/client.truststore.p12:ro
    depends_on:
      namenode: { condition: service_healthy }
      datanode: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

  spark-worker:
    image: apache/spark:3.5.6-scala2.12-java17-python3-ubuntu
    container_name: spark-worker
    hostname: spark-worker
    restart: unless-stopped
    mem_limit: 3584m
    # 4 ядра: 1 занимает постоянная загрузка в HDFS (spark-ingest), 2 — пакетная аналитика
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--cores", "4", "--memory", "3g", "spark://spark-master:7077"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8091:8081"   # Spark Worker UI
    volumes:
      - ./analytics:/opt/analytics:ro
      - ./certs/clients/analytics:/opt/certs/analytics:ro
      - ./certs/clients/client.truststore.p12:/opt/certs/client.truststore.p12:ro
    depends_on:
      spark-master: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Постоянная загрузка analytics-кластер -> HDFS (Spark Structured Streaming, микробатч раз в 15 с)
  spark-ingest:
    image: apache/spark:3.5.6-scala2.12-java17-python3-ubuntu
    container_name: spark-ingest
    hostname: spark-ingest
    restart: unless-stopped
    mem_limit: 1g
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --conf
      - spark.driver.host=spark-ingest
      - --conf
      - spark.driver.memory=512m
      - --conf
      - spark.cores.max=1
      - --conf
      - spark.executor.cores=1
      - --conf
      - spark.executor.memory=768m
      - --conf
      - spark.sql.session.timeZone=UTC
      - /opt/analytics/ingest_to_hdfs.py
      - --mode
      - continuous
    environment:
      ANALYTICS_BOOTSTRAP: kafka-b1:19092,kafka-b2:19092,kafka-b3:19092
      HDFS_URL: hdfs://namenode:8020
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
    volumes:
      - ./analytics:/opt/analytics:ro
      - ./certs/clients/analytics:/opt/certs/analytics:ro
      - ./certs/clients/client.truststore.p12:/opt/certs/client.truststore.p12:ro
    depends_on:
      spark-worker: { condition: service_healthy }
      mirror-maker: { condition: service_healthy }
    healthcheck:
      # UI драйвера доступен, пока работает streaming-запрос
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4040/api/v1/applications', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  # =========================================================================
  # Мониторинг
  # =========================================================================
  # Lag групп потребителей и офсеты топиков основного кластера (Faust, Connect)
  kafka-exporter-primary:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter-primary
    restart: unless-stopped
    mem_limit: 128m
    command:
      - --kafka.server=kafka-1:19092
      - --kafka.server=kafka-2:19092
      - --kafka.server=kafka-3:19092
      - --tls.enabled
      - --tls.ca-file=/certs/ca.crt
      - --tls.cert-file=/certs/kafka-exporter/kafka-exporter.crt
      - --tls.key-file=/certs/kafka-exporter/kafka-exporter.key
      - --topic.filter=^(shop-products|products-filtered|shop-products-dlq|banned-products|client-requests|orders|recommendations)$$
      - --group.filter=^(faust-moderation|connect-.*)$$
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/clients/kafka-exporter:/certs/kafka-exporter:ro
    depends_on: *primary-healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9308/metrics"]
      interval: 15s
      timeout: 10s
      retries: 20

  # Офсеты топиков-копий в аналитическом кластере: для расчёта отставания MirrorMaker 2
  kafka-exporter-analytics:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter-analytics
    restart: unless-stopped
    mem_limit: 128m
    command:
      - --kafka.server=kafka-b1:19092
      - --kafka.server=kafka-b2:19092
      - --kafka.server=kafka-b3:19092
      - --tls.enabled
      - --tls.ca-file=/certs/ca.crt
      - --tls.cert-file=/certs/kafka-exporter/kafka-exporter.crt
      - --tls.key-file=/certs/kafka-exporter/kafka-exporter.key
      - --topic.filter=^primary[.].*
      - --group.filter=^$$
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/clients/kafka-exporter:/certs/kafka-exporter:ro
    depends_on:
      kafka-b1: { condition: service_healthy }
      kafka-b2: { condition: service_healthy }
      kafka-b3: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9308/metrics"]
      interval: 15s
      timeout: 10s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9099:9093"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    entrypoint: ["/bin/sh", "-c"]
    # Telegram включается, только если в .env заданы токен бота и chat_id
    command:
      - |
        if [ -n "$${TELEGRAM_BOT_TOKEN}" ] && [ -n "$${TELEGRAM_CHAT_ID}" ]; then
          sed -e "s|__TELEGRAM_BOT_TOKEN__|$${TELEGRAM_BOT_TOKEN}|" \
              -e "s|__TELEGRAM_CHAT_ID__|$${TELEGRAM_CHAT_ID}|" \
              /etc/alertmanager/alertmanager-telegram.yml.tmpl > /tmp/alertmanager.yml
          echo "Alertmanager: уведомления в Telegram включены"
        else
          cp /etc/alertmanager/alertmanager.yml /tmp/alertmanager.yml
          echo "Alertmanager: Telegram не настроен, только webhook"
        fi
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Приёмник вебхуков Alertmanager: печатает алерты в лог (docker logs -f alert-webhook)
  alert-webhook:
    image: marketplace/app:1.0
    container_name: alert-webhook
    restart: unless-stopped
    mem_limit: 128m
    command: ["python", "-m", "marketplace.alert_webhook"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?задайте GRAFANA_ADMIN_PASSWORD в .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # =========================================================================
  # Kafka UI: оба кластера, только чтение, вход по логину и паролю из .env
  # =========================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      <<: *primary-healthy
      kafka-b1: { condition: service_healthy }
    environment:
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?задайте KAFKA_UI_PASSWORD в .env}
      KAFKA_CLUSTERS_0_NAME: primary
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      KAFKA_CLUSTERS_0_READONLY: "true"
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SSL
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_LOCATION: /etc/kafka/clients/kafka-ui/kafka-ui.keystore.p12
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEY_PASSWORD: ${KEYSTORE_PASSWORD}
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_CLUSTERS_0_SSL_TRUSTSTORELOCATION: /etc/kafka/clients/client.truststore.p12
      KAFKA_CLUSTERS_0_SSL_TRUSTSTOREPASSWORD: ${KEYSTORE_PASSWORD}
      KAFKA_CLUSTERS_1_NAME: analytics
      KAFKA_CLUSTERS_1_BOOTSTRAPSERVERS: kafka-b1:19092,kafka-b2:19092,kafka-b3:19092
      KAFKA_CLUSTERS_1_READONLY: "true"
      KAFKA_CLUSTERS_1_PROPERTIES_SECURITY_PROTOCOL: SSL
      KAFKA_CLUSTERS_1_PROPERTIES_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_CLUSTERS_1_PROPERTIES_SSL_KEYSTORE_LOCATION: /etc/kafka/clients/kafka-ui/kafka-ui.keystore.p12
      KAFKA_CLUSTERS_1_PROPERTIES_SSL_KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
      KAFKA_CLUSTERS_1_PROPERTIES_SSL_KEY_PASSWORD: ${KEYSTORE_PASSWORD}
      KAFKA_CLUSTERS_1_PROPERTIES_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_CLUSTERS_1_SSL_TRUSTSTORELOCATION: /etc/kafka/clients/client.truststore.p12
      KAFKA_CLUSTERS_1_SSL_TRUSTSTOREPASSWORD: ${KEYSTORE_PASSWORD}
    volumes:
      - ./certs/clients/kafka-ui:/etc/kafka/clients/kafka-ui:ro
      - *client-truststore
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  kafka-b1-data:
  kafka-b2-data:
  kafka-b3-data:
  es-data:
  connect-sink:
  prometheus-data:
